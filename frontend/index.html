<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RiosFootball | Camisas de time</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700;1,800&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

  <header id="cabecalho" class="cabecalho"></header>

  <main>
    <!-- O JavaScript desenha os slides aqui, a partir da lista "banners" -->
    <section id="banner" class="banner" aria-label="Destaques"></section>

    <section id="catalogo" class="catalogo">
      <div class="filtros">
        <label>Time
          <select id="filtro-time"><option value="">Todos</option></select>
        </label>
        <label>Tamanho
          <select id="filtro-tamanho"><option value="">Todos</option></select>
        </label>
        <button id="limpar" type="button">Limpar filtros</button>
        <p id="contador" aria-live="polite"></p>
      </div>

      <div id="lista" class="grade"></div>
      <p id="vazio" class="vazio" hidden>Nenhuma camisa encontrada. Tente outro time ou tamanho.</p>
    </section>
  </main>

  <footer class="rodape">RiosFootball &mdash; Camisas de time</footer>

  <!-- Popups: o elemento <dialog> já tem abrir/fechar e a tecla ESC prontos -->
  <dialog id="modal-carrinho" class="modal modal--lado"></dialog>

  <div id="aviso" role="status"></div>
  <a class="zap" href="https://wa.me/5531991829303" target="_blank" rel="noopener">WhatsApp</a>

  <script src="js/config.js"></script>
  <script src="js/comum.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
